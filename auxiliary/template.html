  <style>
:root {
  --page-bg: #ffffff;
  --card-bg: #ffffff;
  --text: #1f2933;
  --muted: #5d6b7a;
  --heading: #16202b;
  --accent: #0b66c3;
  --accent-hover: #084e96;
  --border: #dfe4ea;
  --soft: #f6f8fa;
  --prose: 70ch;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--page-bg); }

body {
  margin: 0;
  padding: 32px 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  color: var(--text);
}

/* The white card holding each page */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 48px 36px;
  background: var(--card-bg);
}

/* ---------- Header & navigation ---------- */
.site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding-bottom: 1rem;
  margin-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}
.site-header p { margin: 0; }
.site-header a.site-name {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--heading);
  letter-spacing: -0.01em;
}
.site-header a.site-name:hover { text-decoration: none; color: var(--accent); }

/* Name with a row of small icon links beside it */
.site-brand { display: flex; align-items: center; gap: 1.25rem; }
.icon-links { display: flex; align-items: center; gap: 0.9rem; }
a.icon-link { display: inline-flex; color: var(--muted); }
a.icon-link:hover { color: var(--accent); text-decoration: none; }
a.icon-link svg { width: 20px; height: 20px; }

.site-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 1.25rem;
}
.site-nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.1rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.site-nav .nav-main a { font-weight: 600; color: var(--heading); }
.site-nav .nav-main a:hover { color: var(--accent); }
.site-nav .nav-external {
  padding-left: 1.25rem;
  border-left: 1px solid var(--border);
}
.site-nav .nav-external a { color: var(--muted); font-size: 0.95rem; }
.site-nav .nav-external a:hover { color: var(--accent); }

/* ---------- Typography ---------- */
h1, h2, h3, h4, h5 {
  color: var(--heading);
  line-height: 1.25;
  font-weight: 700;
  margin: 1.8em 0 0.6em;
}
h1 { font-size: 2.1rem; margin-top: 0.4em; letter-spacing: -0.015em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1.05rem; }
h5 { font-size: 1rem; color: var(--muted); }

/* Keep running text at a readable line length; grids can still use the full width */
.page-content p,
.page-content ul,
.page-content ol,
.page-content blockquote,
.page-content dl { max-width: var(--prose); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 2.25rem 0;
}

/* A rule right after a heading sits tight underneath it */
h1 + hr, h2 + hr, h3 + hr { margin: -0.35rem 0 1.25rem; }

blockquote {
  margin: 0.5rem 0 1.25rem;
  padding: 0.1rem 1rem;
  color: var(--muted);
  border-left: 3px solid var(--border);
}

code {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.05em 0.3em;
}

.page-content li + li { margin-top: 0.2em; }

/* ---------- Images & embeds ---------- */
/* Screenshots, gifs and photos inside a page: natural shape, never upscaled */
.page-content img {
  display: block;
  max-width: min(100%, 720px);
  height: auto;
  border-radius: 8px;
  border: 1px solid var(--border);
}
figure { margin: 1.5rem 0; }
figcaption {
  margin-top: 0.5rem;
  font-size: 0.9rem;
  color: var(--muted);
}
iframe { max-width: 100%; border: 0; }

/* ---------- Thumbnail card grids (portfolio, featured work) ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin: 1rem 0 2rem;
}
/* Plain tiles: just the image with the title (and a muted line) underneath */
.card {
  display: flex;
  flex-direction: column;
  color: inherit;
}
.card:hover { text-decoration: none; color: inherit; }
.page-content .card img {
  width: 100%;
  max-width: none;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  transition: opacity 0.15s ease;
}
.card:hover img { opacity: 0.85; }
.card-title {
  margin-top: 0.6rem;
  font-weight: 650;
  line-height: 1.3;
  color: var(--heading);
}
.card:hover .card-title { color: var(--accent); }
.card-meta {
  font-size: 0.85rem;
  color: var(--muted);
}

/* ---------- Portfolio entries: image on the left, details and blurb on the right ---------- */
.entry {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  padding: 1.75rem 0;
  border-top: 1px solid var(--border);
}
.entry:first-of-type { border-top: 0; padding-top: 0.5rem; }
.entry-img { flex: 0 0 min(30%, 260px); display: block; }
.page-content .entry-img img {
  width: 100%;
  max-width: none;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}
/* Home page: the same entries, but side by side with the text underneath each image */
.entry-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  margin: 1rem 0 2rem;
}
.entry-grid .entry {
  flex-direction: column;
  gap: 14px;
  padding: 0;
  border-top: 0;
}
.entry-grid .entry-img { flex: none; width: 82%; }
.page-content .entry-grid .entry-img img { aspect-ratio: 1 / 1; }
.page-content .entry-grid .entry p { max-width: none; font-size: 0.88rem; line-height: 1.55; }
@media (max-width: 800px) {
  .entry-grid { grid-template-columns: 1fr; gap: 2rem; }
}

/* Stand-in tile for entries that don't have a screenshot yet */
.entry-img.placeholder {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  text-align: center;
  font-weight: 650;
  color: var(--muted);
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.entry-img.placeholder:hover { text-decoration: none; color: var(--accent); }
.entry-body { flex: 1; min-width: 0; }
.entry h3 { margin: 0; font-size: 1.35rem; }
.entry h3 a { color: var(--heading); }
.entry h3 a:hover { color: var(--accent); text-decoration: none; }
.page-content .entry p { margin: 0.5rem 0 0; max-width: 62ch; }
.page-content .entry .entry-sub { margin-top: 0.1rem; color: var(--muted); }
.page-content .entry .facts { font-size: 0.95rem; line-height: 1.55; }
.entry .facts em { color: var(--muted); }
.entry a.more { font-weight: 600; }
@media (max-width: 700px) {
  .entry { flex-direction: column; gap: 14px; }
  .entry-img { flex: none; width: 100%; }
  /* A full-width square would fill the whole phone screen, so use a shorter crop */
  .page-content .entry-img img,
  .entry-img.placeholder { aspect-ratio: 16 / 9; }
}

/* ---------- Project header: hero image beside the project's details ---------- */
.project-header {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  margin: 1.25rem 0 2rem;
}
.project-header .hero { flex: 0 0 min(40%, 380px); display: block; }
.page-content .project-header .hero img {
  width: 100%;
  max-width: none;
}
/* Beside the image the details sit as a plain label list, not a second box */
.project-header .project-info {
  flex: 1;
  min-width: 0;
  max-width: none;
  margin: 0;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 0;
}
@media (max-width: 700px) {
  .project-header { flex-direction: column; gap: 16px; }
  .project-header .hero { flex: none; width: 100%; }
}

/* ---------- Project info box (role, engine, etc.) ---------- */
.project-info {
  max-width: var(--prose);
  margin: 1.25rem 0 2rem;
  padding: 1rem 1.25rem;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.project-info dl {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.35rem 1.5rem;
  margin: 0;
}
.project-info dt { font-weight: 600; color: var(--muted); }
/* Long links (e.g. GitHub URLs) may wrap rather than push the box off narrow screens */
.project-info dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Home page ---------- */
.intro {
  display: flex;
  align-items: center;
  gap: 2rem;
  margin: 0.5rem 0 1rem;
}
.page-content .intro img {
  width: 150px;
  height: 150px;
  flex: none;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--card-bg);
  box-shadow: 0 0 0 1px var(--border);
}
.intro h1 { margin: 0 0 0.25rem; }
.intro .tagline { margin: 0; font-size: 1.15rem; color: var(--muted); }


/* ---------- Footer ---------- */
.site-footer {
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 0.9rem;
  color: var(--muted);
}
.site-footer p { margin: 0; max-width: none; }
.site-footer a { color: var(--muted); }
.site-footer a:hover { color: var(--accent); }

/* ---------- Smaller screens ---------- */
@media (max-width: 800px) {
  body { padding: 16px 10px; font-size: 16px; }
  .container { padding: 20px 20px 28px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .site-nav .nav-external { padding-left: 0; border-left: 0; }
  h1 { font-size: 1.75rem; }
}
@media (max-width: 520px) {
  .intro { flex-direction: column; align-items: flex-start; gap: 1rem; }
  .page-content .intro img { width: 110px; height: 110px; }
  .project-info { padding: 0.85rem 1rem; }
  .project-info dl { gap: 0.35rem 1rem; }
}
  </style>

  $header-includes$
$endfor$
</head>

$for(include-before)$
$include-before$

  </main>

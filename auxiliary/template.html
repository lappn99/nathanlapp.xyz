<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$if(title)$$title$ · Nathan Lapp$else$Nathan Lapp · Gameplay &amp; Systems Programmer$endif$</title>
  <meta name="description" content="$if(description)$$description$$else$Nathan Lapp is a gameplay and systems programmer in Toronto, working on engine architecture, graphics programming and interactive systems.$endif$" />
  <meta name="author" content="Nathan Lapp" />

  <!-- Link previews (LinkedIn, Slack, Discord, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nathan Lapp" />
  <meta property="og:title" content="$if(title)$$title$ · Nathan Lapp$else$Nathan Lapp · Gameplay &amp; Systems Programmer$endif$" />
  <meta property="og:description" content="$if(description)$$description$$else$Gameplay and systems programmer in Toronto, working on engine architecture, graphics programming and interactive systems.$endif$" />
  <meta property="og:image" content="$site_url$/$if(image)$$image$$else$Media/me.jpg$endif$" />
  <meta name="twitter:card" content="summary_large_image" />
$if(redirect)$
  <meta http-equiv="refresh" content="0; url=$redirect$" />
  <meta name="robots" content="noindex" />
$endif$

  <base href="$base_url$" />

  <style>
:root {
  --page-bg: #eef1f4;
  --card-bg: #ffffff;
  --text: #1f2933;
  --muted: #5d6b7a;
  --heading: #16202b;
  --accent: #0b66c3;
  --accent-hover: #084e96;
  --border: #dfe4ea;
  --soft: #f6f8fa;
  --prose: 70ch;
}

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--page-bg); }

body {
  margin: 0;
  padding: 32px 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.65;
  color: var(--text);
}

/* The white card holding each page */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 48px 36px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(22, 32, 43, 0.06);
}

/* ---------- Header & navigation ---------- */
.site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1.5rem;
  padding-bottom: 1rem;
  margin-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}
.site-header p { margin: 0; }
.site-header a.site-name {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--heading);
  letter-spacing: -0.01em;
}
.site-header a.site-name:hover { text-decoration: none; color: var(--accent); }

.site-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 1.25rem;
}
.site-nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.1rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.site-nav .nav-main a { font-weight: 600; color: var(--heading); }
.site-nav .nav-main a:hover { color: var(--accent); }
.site-nav .nav-external {
  padding-left: 1.25rem;
  border-left: 1px solid var(--border);
}
.site-nav .nav-external a { color: var(--muted); font-size: 0.95rem; }
.site-nav .nav-external a:hover { color: var(--accent); }

/* ---------- Typography ---------- */
h1, h2, h3, h4, h5 {
  color: var(--heading);
  line-height: 1.25;
  font-weight: 700;
  margin: 1.8em 0 0.6em;
}
h1 { font-size: 2.1rem; margin-top: 0.4em; letter-spacing: -0.015em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
h4 { font-size: 1.05rem; }
h5 { font-size: 1rem; color: var(--muted); }

/* Keep running text at a readable line length; grids can still use the full width */
.page-content p,
.page-content ul,
.page-content ol,
.page-content blockquote,
.page-content dl { max-width: var(--prose); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 2.25rem 0;
}

blockquote {
  margin: 0.5rem 0 1.25rem;
  padding: 0.1rem 1rem;
  color: var(--muted);
  border-left: 3px solid var(--border);
}

code {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.05em 0.3em;
}

.page-content li + li { margin-top: 0.2em; }

/* ---------- Images & embeds ---------- */
/* Screenshots, gifs and photos inside a page: natural shape, never upscaled */
.page-content img {
  display: block;
  max-width: min(100%, 720px);
  height: auto;
  border-radius: 8px;
  border: 1px solid var(--border);
}
figure { margin: 1.5rem 0; }
figcaption {
  margin-top: 0.5rem;
  font-size: 0.9rem;
  color: var(--muted);
}
iframe { max-width: 100%; border: 0; }

/* ---------- Thumbnail card grids (portfolio, featured work) ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin: 1rem 0 2rem;
}
.card {
  display: flex;
  flex-direction: column;
  color: inherit;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover {
  text-decoration: none;
  color: inherit;
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(22, 32, 43, 0.12);
}
.page-content .card img {
  width: 100%;
  max-width: none;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border: 0;
  border-radius: 0;
}
.card-title {
  padding: 0.7rem 0.85rem 0;
  font-weight: 650;
  line-height: 1.3;
  color: var(--heading);
}
.card-meta {
  padding: 0.2rem 0.85rem 0.8rem;
  font-size: 0.85rem;
  color: var(--muted);
}

/* ---------- Project info box (role, engine, etc.) ---------- */
.project-info {
  max-width: var(--prose);
  margin: 1.25rem 0 2rem;
  padding: 1rem 1.25rem;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.project-info dl {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.35rem 1.5rem;
  margin: 0;
}
.project-info dt { font-weight: 600; color: var(--muted); }
/* Long links (e.g. GitHub URLs) may wrap rather than push the box off narrow screens */
.project-info dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Home page ---------- */
.intro {
  display: flex;
  align-items: center;
  gap: 2rem;
  margin: 0.5rem 0 1rem;
}
.page-content .intro img {
  width: 150px;
  height: 150px;
  flex: none;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--card-bg);
  box-shadow: 0 0 0 1px var(--border);
}
.intro h1 { margin: 0 0 0.25rem; }
.intro .tagline { margin: 0; font-size: 1.15rem; color: var(--muted); }

.buttons { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.5rem 0 0.5rem; }
a.button {
  display: inline-block;
  padding: 0.55rem 1.1rem;
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-weight: 600;
  color: var(--accent);
}
a.button:hover { background: var(--accent); color: #fff; text-decoration: none; }
a.button.primary { background: var(--accent); color: #fff; }
a.button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

/* ---------- Footer ---------- */
.site-footer {
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 0.9rem;
  color: var(--muted);
}
.site-footer p { margin: 0; max-width: none; }
.site-footer a { color: var(--muted); }
.site-footer a:hover { color: var(--accent); }

/* ---------- Smaller screens ---------- */
@media (max-width: 800px) {
  body { padding: 16px 10px; font-size: 16px; }
  .container { padding: 20px 20px 28px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .site-nav .nav-external { padding-left: 0; border-left: 0; }
  h1 { font-size: 1.75rem; }
}
@media (max-width: 520px) {
  .intro { flex-direction: column; align-items: flex-start; gap: 1rem; }
  .page-content .intro img { width: 110px; height: 110px; }
  .project-info { padding: 0.85rem 1rem; }
  .project-info dl { gap: 0.35rem 1rem; }
}
  </style>
$for(header-includes)$
  $header-includes$
$endfor$
</head>

<body>
<div class="container">
$for(include-before)$
$include-before$
$endfor$
  <main class="page-content">
$body$
  </main>
$for(include-after)$
$include-after$
$endfor$
</div>
</body>
</html>
